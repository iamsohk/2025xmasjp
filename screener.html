<style>
  :root { --black:#18181b; --white:#fff; --gray:#f4f4f5; --border:#d4d4d8; }
  * { box-sizing: border-box; }
  body {
    font-family:'Noto Sans HK',sans-serif; background:var(--white); color:var(--black);
    background-image:linear-gradient(rgba(0,0,0,.04) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(0,0,0,.04) 1px,transparent 1px);

  }
  .mono{font-family:'JetBrains Mono',monospace}
  .panel{background:var(--white);border:2px solid var(--black);box-shadow:4px 4px 0 var(--black)}
  .btn{border:2px solid var(--black);background:var(--black);color:var(--white);padding:8px 20px;
       font-family:'JetBrains Mono',monospace;font-size:.875rem;cursor:pointer;
       transition:transform .08s,box-shadow .08s;box-shadow:3px 3px 0 #555}
  .btn:active{transform:translate(2px,2px);box-shadow:none}

  .btn-outline{background:var(--white);color:var(--black);border:2px solid var(--black);box-shadow:3px 3px 0 var(--black)}
  input,textarea,select{background:var(--gray);border:2px solid var(--border);padding:6px 10px;

  input:focus,textarea:focus,select:focus{border-color:var(--black);background:var(--white)}
  table{width:100%;border-collapse:collapse}
  th{background:var(--black);color:var(--white);font-family:'JetBrains Mono',monospace;
     font-size:.78rem;padding:8px 12px;text-align:left;cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{background:#333}

  td{padding:7px 12px;border-bottom:1px solid var(--border);font-size:.85rem;
     font-family:'JetBrains Mono',monospace;white-space:nowrap}
  tr:hover td{background:#fafafa}
  .tag{display:inline-block;font-size:.7rem;padding:2px 6px;border:1px solid;margin:1px;font-family:'JetBrains Mono',monospace}
  .tag-buy{background:#d1fae5;border-color:#059669;color:#065f46}
  .tag-watch{background:#fef3c7;border-color:#d97706;color:#78350f}
  .tag-skip{background:#f4f4f5;border-color:#a1a1aa;color:#52525b}
  .tag-warn{background:#fee2e2;border-color:#dc2626;color:#7f1d1d}
  .tag-info{background:#dbeafe;border-color:#2563eb;color:#1e3a8a}
  .tag-purple{background:#ede9fe;border-color:#7c3aed;color:#4c1d95}
  .badge-buy{background:#059669;color:#fff} .badge-watch{background:#d97706;color:#fff}
  .badge-skip{background:#71717a;color:#fff} .badge-normal{background:#059669;color:#fff}
  .badge-caution{background:#d97706;color:#fff} .badge-frozen{background:#dc2626;color:#fff}
  .badge-unknown{background:#71717a;color:#fff}
  .decision-badge{display:inline-block;padding:2px 10px;font-size:.75rem;
    font-family:'JetBrains Mono',monospace;font-weight:700}
  .star{color:#f59e0b;font-size:1rem}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);
    border-top-color:var(--black);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .score-bar-bg{background:#e4e4e7;height:6px} .score-bar{height:6px;transition:width .4s}
  #toast{position:fixed;bottom:24px;right:24px;background:var(--black);color:var(--white);
    padding:10px 18px;font-family:'JetBrains Mono',monospace;font-size:.85rem;
    border:2px solid var(--white);box-shadow:4px 4px 0 #555;display:none;z-index:999}
  .detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;
    align-items:center;justify-content:center}
  .detail-box{background:var(--white);border:2px solid var(--black);box-shadow:6px 6px 0 var(--black);
    max-width:640px;width:95%;max-height:85vh;overflow-y:auto;padding:24px}
  .progress-row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:.8rem}
  .progress-label{width:140px;flex-shrink:0;font-family:'JetBrains Mono',monospace}

    max-height:120px;overflow-y:auto;background:#fafafa;padding:8px;border:1px solid var(--border);margin-top:12px}

<body>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  Presets & State
// ═══════════════════════════════════════════════════════════════════════════
const PRESETS = {
  sp500: "NVDA AAPL MSFT AMZN GOOGL AVGO META TSLA WMT LLY JPM MU AMD XOM V JNJ ORCL COST CSCO MA CAT CVX ABBV NFLX BAC UNH KO LRCX PG PLTR AMAT HD MS PM GE MRK TXN GS RTX LIN WFC KLAC AXP TMUS IBM QCOM INTC ADBE CRM NOW",
  hk:    "0700.HK 9988.HK 3690.HK 0941.HK 0005.HK 1299.HK 0388.HK 2318.HK 1810.HK 0883.HK 2269.HK 9618.HK 9999.HK 2382.HK 1024.HK",
  tech:  "NVDA AAPL MSFT AMZN GOOGL META TSLA AVGO AMD PLTR ORCL ADBE CRM NOW AMAT LRCX KLAC MU INTC QCOM",
};
let allResults = [];
let sortKey = 'score', sortDir = -1;

function loadPreset(k) { document.getElementById('symbolsInput').value = PRESETS[k]; }

// ═══════════════════════════════════════════════════════════════════════════
//  Yahoo Finance via CORS proxies
// ═══════════════════════════════════════════════════════════════════════════
const PROXIES = [
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
];

async function fetchProxied(url) {
  let lastErr;
  for (const p of PROXIES) {
    try {
      const r = await fetch(p(url), { headers: { 'Accept': 'application/json' } });
      if (!r.ok) { lastErr = new Error(`HTTP ${r.status}`); continue; }
      const text = await r.text();
      try { return JSON.parse(text); } catch(e) { lastErr = e; }
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('All proxies failed');
}

async function fetchWeeklyCandles(ticker) {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1wk&range=6y`;
  const data = await fetchProxied(url);
  const r = data?.chart?.result?.[0];
  if (!r) throw new Error('No data');
  const ts = r.timestamp || [];
  const q  = r.indicators?.quote?.[0] || {};
  const adj = r.indicators?.adjclose?.[0]?.adjclose || q.close || [];
  const out = [];
  for (let i = 0; i < ts.length; i++) {
    const o=q.open?.[i], h=q.high?.[i], l=q.low?.[i], c=adj?.[i] ?? q.close?.[i], v=q.volume?.[i];
    if (o == null || h == null || l == null || c == null) continue;
    out.push({
      timestamp: new Date(ts[i]*1000).toISOString().slice(0,10),
      open: o, high: h, low: l, close: c, volume: v || 0,
    });
  }
  return out;
}

async function fetchEarningsDate(ticker) {
  try {
    const url = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${encodeURIComponent(ticker)}?modules=calendarEvents`;
    const d = await fetchProxied(url);
    const ev = d?.quoteSummary?.result?.[0]?.calendarEvents?.earnings?.earningsDate?.[0]?.raw;
    if (!ev) return null;
    return new Date(ev * 1000);
  } catch { return null; }
}

// ═══════════════════════════════════════════════════════════════════════════
//  Math helpers
// ═══════════════════════════════════════════════════════════════════════════
const _c = a => a.map(x=>x.close);
const _h = a => a.map(x=>x.high);
const _l = a => a.map(x=>x.low);
const _v = a => a.map(x=>x.volume);
const _o = a => a.map(x=>x.open);

function sma(vals, n) {
  if (vals.length < n) return null;
  let s = 0; for (let i = vals.length - n; i < vals.length; i++) s += vals[i];
  return s / n;
}
function isRising(vals, lb = 4) {
  if (vals.length < lb + 1) return false;
  return vals[vals.length-1] > vals[vals.length-1-lb];
}
function maxN(arr, n) { return Math.max(...arr.slice(-n)); }
function minN(arr, n) { return Math.min(...arr.slice(-n)); }

// ═══════════════════════════════════════════════════════════════════════════
//  Core analysis (port of jlaw_screener.py)
// ═══════════════════════════════════════════════════════════════════════════
function analyse(symbol, candles, benchCandles, accountSize, riskPct, earningsDate) {
  const base = {
    symbol, decision: 'SKIP', score: 0, tags: [], score_breakdown: [],
    close: null, stop: null, stop_pct: null, shares: null,
    buy_rules_match: false, earnings_window: false,
    rs_score: null, rs_rank: null, rs_rank_total: null,
    ma10: null, ma20: null, ma50: null, ma200: null,
    distance_52h: null, vol_ratio: null, error: null,
  };
  if (!candles || candles.length < 80) {
    base.error = 'insufficient_data';
    base.tags.push('insufficient_data');
    return base;
  }

  const c = _c(candles), h = _h(candles), l = _l(candles),
        v = _v(candles), o = _o(candles);
  const price = c[c.length-1];

  const ma10  = sma(c, 10);
  const ma20  = sma(c, 20);
  const ma50  = c.length >= 50  ? sma(c, 50)  : null;
  const ma200 = c.length >= 200 ? sma(c, 200) : null;

  base.close = +price.toFixed(2);
  base.ma10 = ma10  ? +ma10.toFixed(2)  : null;
  base.ma20 = ma20  ? +ma20.toFixed(2)  : null;
  base.ma50 = ma50  ? +ma50.toFixed(2)  : null;
  base.ma200= ma200 ? +ma200.toFixed(2) : null;

  const h52 = h.length >= 52 ? maxN(h, 52) : Math.max(...h);
  const l52 = l.length >= 52 ? minN(l, 52) : Math.min(...l);
  base.distance_52h = +(((price / h52) - 1) * 100).toFixed(1);

  let score = 0;
  const tags = base.tags, bd = base.score_breakdown;

  // ── Stage 2 ────────────────────────────────────────────────────────────
  let stage2 = false;
  if (ma50 && ma200 && c.length >= 54) {
    const ma50_prev = sma(c.slice(0, c.length - 4), 50);
    const ma50_rising = ma50_prev != null && ma50 > ma50_prev;
    stage2 = price > ma50 && ma50 > ma200
          && ma50_rising
          && price >= h52 * 0.75
          && price >= l52 * 1.25;
  }
  if (stage2) { score += 25; tags.push('stage2'); bd.push(['Stage 2', 25]); }

  // ── MA Stack ───────────────────────────────────────────────────────────
  const ma_stack = ma10 && ma20 && ma50 && ma200
                 && price > ma10 && ma10 > ma20 && ma20 > ma50 && ma50 > ma200;
  if (ma_stack) { score += 15; tags.push('ma_stack'); bd.push(['MA Stack', 15]); }

  // ── RS Score ───────────────────────────────────────────────────────────
  const bc = _c(benchCandles || []);
  let rs_score = null;
  if (bc.length >= 52 && c.length >= 52) {
    const ret = (s, n) => s.length >= n ? s[s.length-1]/s[s.length-n] - 1 : 0;
    rs_score = +(
      ((ret(c,13) - ret(bc,13)) * 0.5
     + (ret(c,26) - ret(bc,26)) * 0.3
     + (ret(c,52) - ret(bc,52)) * 0.2) * 100
    ).toFixed(2);
    base.rs_score = rs_score;
  }
  const rs_beats = rs_score != null && rs_score > 0;
  if (rs_beats) { score += 20; tags.push('rs_leader'); bd.push(['RS Leader', 20]); }

  // ── Volume ─────────────────────────────────────────────────────────────
  let vol_ratio = null;
  if (v.length >= 20) {
    const avg20 = sma(v, 20);
    if (avg20 && avg20 > 0) vol_ratio = v[v.length-1] / avg20;
  }
  base.vol_ratio = vol_ratio ? +vol_ratio.toFixed(2) : null;
  const vol_confirmed = vol_ratio != null && vol_ratio >= 1.5;
  if (vol_confirmed) { score += 10; tags.push('volume_confirmed'); bd.push(['Volume', 10]); }

  // ── Breakout ───────────────────────────────────────────────────────────
  let breakout = false, stop = null;
  if (h.length >= 14 && vol_confirmed) {
    const h13 = Math.max(...h.slice(-14, -1));
    if (price > h13 * 1.005) { breakout = true; stop = h13 * 0.97; }
  }
  if (breakout) { score += 20; tags.push('breakout'); bd.push(['Breakout', 20]); }

  // ── Pullback ───────────────────────────────────────────────────────────
  let pullback = false;
  if (stage2 && !breakout) {
    const near20 = ma20 && Math.abs(price - ma20)/ma20 <= 0.035 && c[c.length-1] > o[o.length-1];
    const near50 = ma50 && Math.abs(price - ma50)/ma50 <= 0.040 && c[c.length-1] > o[o.length-1];
    pullback = near20 || near50;
  }
  if (pullback) {
    score += 15; tags.push('pullback'); bd.push(['Pullback', 15]);
    const cands = [];
    if (ma20) cands.push(ma20 * 0.97);
    if (ma50) cands.push(ma50 * 0.98);
    const valid = cands.filter(s => s < price);
    stop = valid.length ? Math.max(...valid) : price * 0.92;
  }

  if (stop == null) stop = ma50 ? ma50 * 0.98 : price * 0.92;

  // ── Bullish Candle ─────────────────────────────────────────────────────
  if (c[c.length-1] > o[o.length-1] && (c[c.length-1]/o[o.length-1] - 1) >= 0.02) {
    score += 5; tags.push('bullish_candle'); bd.push(['Bullish Candle', 5]);
  }

  // ── Distribution Warning ────────────────────────────────────────────────
  if (c[c.length-1] < o[o.length-1] && (o[o.length-1]/c[c.length-1] - 1) >= 0.03 && vol_confirmed) {
    score -= 25; tags.push('distribution_warning'); bd.push(['Distribution', -25]);
  }

  // ── VCP-like ───────────────────────────────────────────────────────────
  if (h.length >= 13 && l.length >= 13) {
    const rng = (a, b) => { let s=0, n=0; for (let i=a;i<b;i++){ s+=h[i]-l[i]; n++; } return n?s/n:0; };
    const n = h.length;
    const r3 = rng(n-3, n), r8 = rng(n-8, n-3), r13 = rng(n-13, n-8);
    if (r3 < r8 && r8 < r13) { score += 5; tags.push('vcp_like'); bd.push(['VCP-like', 5]); }
  }

  // ── Earnings Window ─────────────────────────────────────────────────────
  if (earningsDate) {
    const today = new Date(); today.setHours(0,0,0,0);
    const diffDays = Math.round((earningsDate - today) / 86400000);
    if (diffDays >= -2 && diffDays <= 10) {
      base.earnings_window = true;
      score -= 20; tags.push('earnings_window'); bd.push(['Earnings Window', -20]);
    }
  }

  score = Math.max(0, Math.min(100, score));
  base.score = score;

  const stop_pct = (price - stop) / price * 100;
  base.stop     = +stop.toFixed(2);
  base.stop_pct = +stop_pct.toFixed(1);

  if (stop < price) {
    const risk_amt = accountSize * riskPct;
    const rps = price - stop;
    let shares = Math.floor(risk_amt / rps);
    const cap  = Math.floor(accountSize * 0.10 / price);
    if (shares > cap) { tags.push('position_cap'); shares = cap; }
    base.shares = shares;
  }

  if (stage2 && (breakout || pullback) && rs_beats && score >= 65 && !base.earnings_window) {
    base.decision = 'BUY_CANDIDATE';
  } else if (stage2 && score >= 45) {
    base.decision = 'WATCH';
  } else {
    base.decision = 'SKIP';
  }

  return base;
}

function fillRsRanks(results) {
  const ranked = results.filter(r => r.rs_score != null)
                        .sort((a,b) => b.rs_score - a.rs_score);
  const n = ranked.length;
  ranked.forEach((r, i) => { r.rs_rank = i + 1; r.rs_rank_total = n; });
}

function applyMarketStatus(results, mstatus) {
  for (const r of results) {
    if (mstatus === 'FROZEN' && r.decision === 'BUY_CANDIDATE') {
      r.decision = 'WATCH'; r.tags.push('market_frozen');
    } else if (mstatus === 'CAUTION' && r.decision === 'BUY_CANDIDATE') {
      r.decision = 'WATCH'; r.tags.push('market_caution');
    }
  }
}

function markBuyRules(results, mstatus) {
  for (const r of results) {
    if (r.score >= 80
        && r.rs_rank != null && r.rs_rank <= 10
        && r.tags.includes('stage2')
        && !r.earnings_window
        && mstatus === 'NORMAL'
        && r.distance_52h != null && r.distance_52h >= -15
        && r.stop_pct != null && r.stop_pct <= 12) {
      r.buy_rules_match = true;
    }
  }
}

function marketStatus(benchCandles) {
  if (!benchCandles || benchCandles.length < 210) return 'UNKNOWN';
  const c = _c(benchCandles);
  const price = c[c.length-1];
  const ma200 = sma(c, 200);
  const ma50  = sma(c, 50);
  if (!ma200 || !ma50) return 'UNKNOWN';
  if (price > ma200 && price > ma50 && isRising(c, 4)) return 'NORMAL';
  if (price < ma200) return 'FROZEN';
  return 'CAUTION';
}

// ═══════════════════════════════════════════════════════════════════════════
//  Scan loop
// ═══════════════════════════════════════════════════════════════════════════
function logLine(msg) {
  const el = document.getElementById('logArea');
  el.classList.remove('hidden');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

async function startScan() {
  const btn = document.getElementById('scanBtn');
  const stat = document.getElementById('scanStatus');
  btn.disabled = true; btn.textContent = '掃描中...';
  document.getElementById('logArea').textContent = '';

  const rawSyms  = document.getElementById('symbolsInput').value.trim();
  const symbols  = rawSyms ? rawSyms.split(/[\s,]+/).filter(Boolean) : PRESETS.sp500.split(/\s+/);
  const benchmark    = document.getElementById('benchmark').value.trim() || 'SPY';
  const accountSize  = parseFloat(document.getElementById('accountSize').value) || 100000;
  const riskPct      = (parseFloat(document.getElementById('riskPct').value) || 0.5) / 100;

  const t0 = Date.now();
  let mstatus = 'UNKNOWN';
  let benchCandles = null;

  try {
    stat.innerHTML = '<span class="spinner"></span> 拉 benchmark...';
    logLine(`[*] Benchmark: ${benchmark}`);
    benchCandles = await fetchWeeklyCandles(benchmark);
    mstatus = marketStatus(benchCandles);
    logLine(`[*] Market status: ${mstatus} (${benchCandles.length} weeks)`);
    updateMarketBadge(benchmark, mstatus, benchCandles[benchCandles.length-1]?.close);
  } catch (e) {
    logLine(`[!] Benchmark fetch failed: ${e.message}`);
    toast('Benchmark 失敗: ' + e.message, true);
    btn.disabled = false; btn.textContent = '▶ 開始掃描'; stat.textContent = '';
    return;
  }

  // Fetch all symbols in parallel batches
  const BATCH = 5;
  const results = [];
  for (let i = 0; i < symbols.length; i += BATCH) {
    const batch = symbols.slice(i, i + BATCH);
    stat.innerHTML = `<span class="spinner"></span> 掃描 ${i + 1}-${Math.min(i+BATCH, symbols.length)} / ${symbols.length}...`;
    const batchResults = await Promise.all(batch.map(async sym => {
      try {
        const [candles, earn] = await Promise.all([
          fetchWeeklyCandles(sym),
          fetchEarningsDate(sym),
        ]);
        const r = analyse(sym, candles, benchCandles, accountSize, riskPct, earn);
        logLine(`  ${sym}: ${r.decision} (score ${r.score})`);
        return r;
      } catch (e) {
        logLine(`  ${sym}: error ${e.message}`);
        return { symbol: sym, decision: 'SKIP', score: 0, tags: ['fetch_error'],
                 error: e.message, score_breakdown: [],
                 close: null, stop: null, stop_pct: null, shares: null,
                 buy_rules_match: false, earnings_window: false,
                 rs_score: null, rs_rank: null, distance_52h: null };
      }
    }));
    results.push(...batchResults);
  }

  fillRsRanks(results);
  applyMarketStatus(results, mstatus);
  markBuyRules(results, mstatus);

  allResults = results;
  const elapsed = ((Date.now() - t0)/1000).toFixed(1);
  renderTable();
  renderSummary(results, elapsed);
  logLine(`[*] Done in ${elapsed}s`);
  toast(`完成！${results.length} 隻股票`);

  btn.disabled = false; btn.textContent = '▶ 開始掃描'; stat.textContent = '';
}

// ═══════════════════════════════════════════════════════════════════════════
//  Rendering
// ═══════════════════════════════════════════════════════════════════════════
function updateMarketBadge(bm, status, price) {
  const cls = { NORMAL:'badge-normal', CAUTION:'badge-caution',
                FROZEN:'badge-frozen', UNKNOWN:'badge-unknown' }[status] || 'badge-unknown';
  const p = price ? ` $${price.toFixed(2)}` : '';
  document.getElementById('marketBadge').innerHTML =
    `<span class="decision-badge ${cls} border-2 border-black">${bm}${p} — ${status}</span>`;
}

function renderSummary(results, elapsed) {
  document.getElementById('sumTime').textContent  = elapsed + 's';
  document.getElementById('sumBuy').textContent   = results.filter(r=>r.decision==='BUY_CANDIDATE').length;
  document.getElementById('sumWatch').textContent = results.filter(r=>r.decision==='WATCH').length;
  document.getElementById('sumSkip').textContent  = results.filter(r=>r.decision==='SKIP').length;
  document.getElementById('sumBuyRules').textContent = results.filter(r=>r.buy_rules_match).length;
  document.getElementById('summaryBar').classList.remove('hidden');
}

function getVal(r, k) {
  if (k === 'decision') return ({BUY_CANDIDATE:3,WATCH:2,SKIP:1})[r.decision] || 0;
  return r[k] ?? -999;
}

function renderTable() {
  const filter = document.getElementById('filterDecision').value;
  const rows = allResults.filter(r => filter === 'ALL' || r.decision === filter);
  const sorted = [...rows].sort((a,b) => sortDir * (getVal(a,sortKey) - getVal(b,sortKey)));

  document.querySelectorAll('th[data-key]').forEach(th => {
    th.classList.remove('sorted-asc','sorted-desc');
    if (th.dataset.key === sortKey) th.classList.add(sortDir === 1 ? 'sorted-asc' : 'sorted-desc');
  });

  const tbody = document.getElementById('resultsBody');
  tbody.innerHTML = '';
  document.getElementById('resultsPanel').style.display = sorted.length ? 'block' : 'none';
  document.getElementById('emptyMsg').classList.toggle('hidden', sorted.length > 0);

  sorted.forEach(r => {
    const tr = document.createElement('tr');
    tr.style.cursor = 'pointer';
    tr.onclick = () => openDetail(r);

    const decCls = { BUY_CANDIDATE:'badge-buy', WATCH:'badge-watch', SKIP:'badge-skip' }[r.decision]||'badge-skip';
    const star = r.buy_rules_match ? '<span class="star">★</span> ' : '';
    const rk = r.rs_rank ? `#${r.rs_rank}/${r.rs_rank_total}` : '—';
    const tags = buildTags(r.tags);
    const scoreColor = r.score >= 80 ? '#059669' : r.score >= 65 ? '#d97706' : r.score >= 45 ? '#2563eb' : '#71717a';
    const dist52 = r.distance_52h != null ? `${r.distance_52h}%` : '—';
    const stopp  = r.stop_pct != null ? `${r.stop_pct}%` : '—';
    const close  = r.close != null ? `$${r.close.toFixed(2)}` : '—';
    const shs    = r.shares != null ? r.shares : '—';

    tr.innerHTML = `
      <td class="font-bold">${star}${r.symbol}</td>
      <td><span class="decision-badge ${decCls}">${r.decision}</span></td>
      <td>
        <div class="flex items-center gap-2">
          <span style="color:${scoreColor};font-weight:700">${r.score}</span>
          <div class="score-bar-bg" style="width:60px">
            <div class="score-bar" style="width:${r.score}%;background:${scoreColor}"></div>
          </div>
        </div>
      </td>
      <td>${rk}</td>
      <td>${close}</td>
      <td style="color:${r.distance_52h >= -5 ? '#059669' : r.distance_52h >= -15 ? '#d97706' : '#dc2626'}">${dist52}</td>
      <td style="color:${r.stop_pct <= 8 ? '#059669' : r.stop_pct <= 12 ? '#d97706' : '#dc2626'}">${stopp}</td>
      <td>${shs}</td>
      <td style="max-width:280px;white-space:normal">${tags}</td>
    `;
    tbody.appendChild(tr);
  });
}

const TAG_STYLE = {
  buy_rules_match:'tag-buy', stage2:'tag-buy', ma_stack:'tag-buy',
  rs_leader:'tag-buy', breakout:'tag-buy', pullback:'tag-buy',
  volume_confirmed:'tag-info', bullish_candle:'tag-info', vcp_like:'tag-purple',
  distribution_warning:'tag-warn', earnings_window:'tag-warn',
  market_frozen:'tag-warn', market_caution:'tag-warn',
  position_cap:'tag-watch', insufficient_data:'tag-skip', fetch_error:'tag-warn',
};
const TAG_LABEL = {
  stage2:'S2', ma_stack:'MA排列', rs_leader:'RS強', breakout:'突破', pullback:'拉回',
  volume_confirmed:'量確認', bullish_candle:'陽燭', vcp_like:'VCP型',
  distribution_warning:'⚠ 派貨', earnings_window:'⚠ 業績期',
  market_frozen:'⛔ 市凍', market_caution:'⚠ 市警',
  position_cap:'10%上限', insufficient_data:'數據不足', fetch_error:'⚠ 讀取失敗',
};

function buildTags(tags) {
  return tags.map(t => {
    const cls = TAG_STYLE[t] || 'tag-skip';
    const lbl = TAG_LABEL[t] || t;
    return `<span class="tag ${cls}">${lbl}</span>`;
  }).join('');
}

function openDetail(r) {
  const box = document.getElementById('detailBox');
  const rk = r.rs_rank ? `#${r.rs_rank} / ${r.rs_rank_total}` : '—';
  const decCls = { BUY_CANDIDATE:'badge-buy', WATCH:'badge-watch', SKIP:'badge-skip' }[r.decision]||'badge-skip';

  const bdHtml = (r.score_breakdown||[]).map(([label, pts]) => {
    const col = pts > 0 ? '#059669' : '#dc2626';
    const w   = Math.abs(pts) / 25 * 100;
    return `<div class="progress-row">
      <span class="progress-label">${label}</span>
      <div class="score-bar-bg flex-1"><div class="score-bar" style="width:${w}%;background:${col}"></div></div>
      <span class="progress-val" style="color:${col}">${pts > 0 ? '+' : ''}${pts}</span>
    </div>`;
  }).join('');

  const maRow = (label, val, ref) => {
    const color = val && ref && val > ref ? '#059669' : '#dc2626';
    return `<tr><td class="py-1 pr-4 text-zinc-500">${label}</td><td style="color:${color}">${val ? '$'+val.toFixed(2) : '—'}</td></tr>`;
  };

  box.innerHTML = `
    <div class="flex items-start justify-between mb-4">
      <div>
        <h2 class="mono text-xl font-bold">${r.buy_rules_match ? '★ ' : ''}${r.symbol}</h2>
        <span class="decision-badge ${decCls} mt-1 inline-block">${r.decision}</span>
        ${r.buy_rules_match ? '<span class="tag tag-buy ml-2">✓ 符合買入規則</span>' : ''}
      </div>
      <button onclick="closeDetail()" class="mono text-xl font-bold px-2 hover:bg-zinc-100">✕</button>
    </div>
    <div class="grid grid-cols-2 gap-4 mb-5">
      <div class="border border-zinc-200 p-3">
        <div class="text-xs text-zinc-500 mono mb-2">價格 & 均線</div>
        <table>
          <tr><td class="py-1 pr-4 text-zinc-500">收市</td><td class="font-bold">${r.close ? '$'+r.close.toFixed(2) : '—'}</td></tr>
          ${maRow('10W', r.ma10, r.close)}
          ${maRow('20W', r.ma20, r.close)}
          ${maRow('50W', r.ma50, r.close)}
          ${maRow('200W', r.ma200, r.close)}
          <tr><td class="py-1 pr-4 text-zinc-500">距52高</td>
              <td style="color:${r.distance_52h >= -15 ? '#059669' : '#dc2626'}">${r.distance_52h != null ? r.distance_52h+'%' : '—'}</td></tr>
        </table>
      </div>
      <div class="border border-zinc-200 p-3">
        <div class="text-xs text-zinc-500 mono mb-2">風控 & MRA</div>
        <table>
          <tr><td class="py-1 pr-4 text-zinc-500">止損位</td><td>${r.stop ? '$'+r.stop.toFixed(2) : '—'}</td></tr>
          <tr><td class="py-1 pr-4 text-zinc-500">止損%</td>
              <td style="color:${r.stop_pct <= 12 ? '#059669' : '#dc2626'}">${r.stop_pct != null ? r.stop_pct+'%' : '—'}</td></tr>
          <tr><td class="py-1 pr-4 text-zinc-500">建議股數</td><td class="font-bold">${r.shares ?? '—'}</td></tr>
          <tr><td class="py-1 pr-4 text-zinc-500">RS排名</td><td>${rk}</td></tr>
          <tr><td class="py-1 pr-4 text-zinc-500">RS分</td><td>${r.rs_score != null ? r.rs_score+'%' : '—'}</td></tr>
          <tr><td class="py-1 pr-4 text-zinc-500">成交量比</td><td>${r.vol_ratio != null ? r.vol_ratio.toFixed(2)+'x' : '—'}</td></tr>
        </table>
      </div>
    </div>
    <div class="border border-zinc-200 p-3 mb-4">
      <div class="text-xs text-zinc-500 mono mb-3">分數拆解 (總分 ${r.score}/100)</div>
      ${bdHtml || '<p class="text-zinc-400 text-sm">無數據</p>'}
    </div>
    <div class="mb-4">
      <div class="text-xs text-zinc-500 mono mb-2">標籤</div>
      ${buildTags(r.tags)}
    </div>
    <div class="text-xs text-zinc-400 mono">數據源: Yahoo Finance · ${r.error || '正常'}</div>
  `;
  document.getElementById('detailOverlay').style.display = 'flex';
}

function closeDetail(e) {
  if (!e || e.target === document.getElementById('detailOverlay')) {
    document.getElementById('detailOverlay').style.display = 'none';
  }
}

function toast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = err ? '#dc2626' : '#18181b';
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}

// ── Event handlers ─────────────────────────────────────────────────────────
document.getElementById('filterDecision').addEventListener('change', renderTable);
document.querySelectorAll('th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const k = th.dataset.key;
    if (sortKey === k) sortDir = -sortDir;
    else { sortKey = k; sortDir = -1; }
    renderTable();
  });
});

// 預設載入 S&P 500
loadPreset('sp500');
</script>
